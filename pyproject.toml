[project]
name = "recallbase-lc-rag"
version = "0.1.0"
description = "RAG assistant built with LangChain (2-step RAG). Same app, documents and questions as recallbase-rag."
readme = "README.md"
authors = [
    { name = "sivahere4cloud", email = "sivaganeshcloud@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
recallbase-lc-rag = "recallbase_lc_rag:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
